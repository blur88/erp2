# Print/PDF gate overrides (#1214).
#
# ALWAYS used as:
#   docker compose -p erp_print_gate \
#     -f docker-compose.yml -f docker-compose.print-gate.yml
#
# docker-compose.yml is named explicitly so the auto-loaded
# docker-compose.override.yml cannot leak dev-only settings in; this file must
# follow it to win.
#
# Every override here exists because the base file fixes a resource that
# ignores or defeats the -p project prefix:
#   - container_name overrides the project prefix entirely
#   - image: erp-*:latest would overwrite a developer's local images
#   - fixed host ports collide with a running dev stack
#   - ./data, ./uploads, ./logs, ./backups write into the working tree
#
# The top-level nginx service is NEVER started here: it publishes 80/443. The
# frontend service's own nginx already proxies /api/ to the backend
# (frontend/nginx.conf:35) and serves the bundle with production headers, which
# is the print-CSS serving path under test.
#
# nginx is still neutralised below (name/image/ports): the isolation check
# asserts against the RESOLVED config, which contains every defined service, so
# any fixed resource left on nginx would read as a collision even though the CI
# job only ever starts postgres redis backend frontend explicitly.
#
# container_name uses `!reset null` (compose >= 2.32 tag): plain `null` does not
# clear the base value on current compose, and a fixed name of any kind would
# override the -p project prefix. With no container_name, containers get
# project-prefixed generated names.
services:
  postgres:
    container_name: !reset null
    ports: !override
      - "${PRINT_GATE_PG_PORT:-5442}:5432"
    volumes: !override
      - ./.print-gate-data/postgres:/var/lib/postgresql/data/pgdata
      - ./database/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: erp_print_gate
      POSTGRES_USER: erp_print_gate
      POSTGRES_PASSWORD: print_gate_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_print_gate -d erp_print_gate"]

  redis:
    container_name: !reset null
    ports: !override
      - "${PRINT_GATE_REDIS_PORT:-6399}:6379"
    volumes: !override
      - ./.print-gate-data/redis:/data

  backend:
    container_name: !reset null
    image: erp-backend:print-gate
    ports: !override
      - "${PRINT_GATE_API_PORT:-3101}:3001"
    volumes: !override
      - ./.print-gate-data/uploads:/app/uploads
      - ./.print-gate-data/logs:/app/logs
      - ./.print-gate-data/backups:/app/backups
    environment:
      - DB_DATABASE=erp_print_gate
      - DB_USERNAME=erp_print_gate
      - DB_PASSWORD=print_gate_password
      - DB_SYNCHRONIZE=false
      - DB_SSL=false

  frontend:
    container_name: !reset null
    image: erp-frontend:print-gate
    ports: !override
      - "${PRINT_GATE_FRONTEND_PORT:-3100}:80"

  # NEVER started by the gate (see header): neutralised only so the resolved
  # config carries no shared name/image/ports for this service.
  nginx:
    container_name: !reset null
    image: erp-nginx:print-gate
    ports: !override []
