# Frontend server: serves the built web app and nothing else (#1959, ADR 0003).
#
# It is reachable only from the Ingress (nginx/), which is the single published
# entry point. There is deliberately no /api/, /uploads/ or /socket.io/ proxy
# here: those requests must pass through the Ingress, where the rate limits
# live. Security headers are the Ingress's job too (nginx/security-headers.conf);
# a second set here would only reach the client as conflicting duplicates.
#
# Caching is owned by this server and passes through the Ingress untouched:
#   /assets/*      content-hashed by Vite       -> long max-age + immutable
#   everything else (index.html, SPA routes,
#   /env-config.js, public files)               -> no-cache (always revalidate)
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Content-hashed build output. A hit is immutable; a miss must be a plain
    # 404, never the SPA fallback (an HTML body cached as a script would stick).
    # Not `always`: error responses must not inherit the immutable header.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # React Router (SPA) - serve index.html for all routes. Also serves
    # /env-config.js, which the container entrypoint rewrites at start-up.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Container health check
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
