# Frontend server (see docs/adr/0003-ingress-only-entry-point.md).
#
# Serves the built web app and the startup-generated env-config.js to the
# Ingress, which is the only published entry point. Backend routing, rate
# limits and security headers belong to the Ingress; do not add proxy
# locations or security headers here. This server owns only the cache policy
# for the files it serves.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Cache policy. Each response gets exactly one Cache-Control, emitted by
    # add_header only (`expires` would write a second one). Any location that
    # declares its own add_header replaces this default rather than adding to
    # it, so every such location states its full policy.
    #
    # Default: revalidate. Covers index.html, the SPA fallback and the
    # unhashed files copied from public/.
    add_header Cache-Control "no-cache" always;

    # Content-hashed Vite build output: a changed file gets a new URL.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Rewritten by docker-entrypoint.sh on every container start while its URL
    # stays the same, so browsers must revalidate it.
    location = /env-config.js {
        add_header Cache-Control "no-cache" always;
    }

    # React Router (SPA) - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
