# Local development overrides — auto-applied by "docker compose up"
# NOT used in production. For production: docker compose -f docker-compose.yml up -d

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  backend:
    environment:
      # DB_SYNCHRONIZE is deliberately absent. Letting TypeORM reshape the
      # schema on boot is what left the migrations table empty, which made the
      # #950 baseline transition destructive (#962). Change entities via
      # `npm run migration:generate --name=X` instead.
      - LOG_LEVEL=debug
      - DEBUG_MODE=true
      - ENABLE_SWAGGER=true
