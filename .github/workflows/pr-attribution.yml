name: PR attribution

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  attribution:
    name: PR attribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check commit messages and description
        run: bash scripts/check-pr-attribution.sh "$GITHUB_EVENT_PATH"
