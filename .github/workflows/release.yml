name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      new_release_published: ${{ steps.semantic_release.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic_release.outputs.new_release_version }}

    steps:
      - name: Check for redundant trigger
        id: guard
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # Skip only "git pull --no-ff" re-triggers: merge of 'main' into 'main' locally after semantic-release auto-commit
          if echo "$MSG" | grep -qE "^Merge branch '(main|master)' of "; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Detected redundant git-pull merge commit — skipping semantic-release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install release tools
        run: |
          npm install --no-save --package-lock=false \
            semantic-release@25.0.3 \
            @semantic-release/commit-analyzer@13.0.1 \
            @semantic-release/release-notes-generator@14.1.0 \
            @semantic-release/npm@13.1.5 \
            @semantic-release/git@10.0.1 \
            @semantic-release/github@12.0.6 \
            conventional-changelog-angular@8.1.0

      - name: Run semantic-release
        if: steps.guard.outputs.skip != 'true'
        id: semantic_release
        run: |
          npx semantic-release | tee /tmp/sr-output.txt
          exit_code=${PIPESTATUS[0]}
          version=$(grep -oP 'Published release \K[0-9]+\.[0-9]+\.[0-9]+' /tmp/sr-output.txt | tail -1)
          if [ $exit_code -eq 0 ] && [ -n "$version" ]; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
            echo "new_release_version=" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: refs/tags/v${{ needs.release.outputs.new_release_version }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Build and push backend image
        uses: docker/build-push-action@v7.1.0
        with:
          context: ./backend
          push: true
          tags: |
            blur88/all:erp-backend
            blur88/all:erp-backend-v${{ needs.release.outputs.new_release_version }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7.1.0
        with:
          context: ./frontend
          push: true
          tags: |
            blur88/all:erp-frontend
            blur88/all:erp-frontend-v${{ needs.release.outputs.new_release_version }}

      - name: Build and push nginx image
        uses: docker/build-push-action@v7.1.0
        with:
          context: ./nginx
          push: true
          tags: |
            blur88/all:erp-nginx
            blur88/all:erp-nginx-v${{ needs.release.outputs.new_release_version }}
