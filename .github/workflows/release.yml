name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      new_release_published: ${{ steps.semantic_release.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic_release.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install release test dependencies
        run: npm ci

      - name: Release validation
        run: npm run test:release

      - name: Install release tools
        run: |
          npm install --no-save --package-lock=false \
            semantic-release@25.0.3 \
            @semantic-release/commit-analyzer@13.0.1 \
            @semantic-release/release-notes-generator@14.1.0 \
            @semantic-release/github@12.0.6

      - name: Run semantic-release
        id: semantic_release
        run: bash scripts/run-semantic-release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: refs/tags/v${{ needs.release.outputs.new_release_version }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Build and push backend image
        uses: docker/build-push-action@v7.1.0
        with:
          context: ./backend
          push: true
          provenance: mode=max,version=v0.2
          sbom: true
          build-args: APP_VERSION=${{ needs.release.outputs.new_release_version }}
          tags: |
            blur88/erp2:v${{ needs.release.outputs.new_release_version }}-backend
            blur88/erp2:latest-backend
            blur88/master:v${{ needs.release.outputs.new_release_version }}-backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v7.1.0
        with:
          context: ./frontend
          push: true
          provenance: mode=max,version=v0.2
          sbom: true
          build-args: VITE_APP_VERSION=${{ needs.release.outputs.new_release_version }}
          tags: |
            blur88/erp2:v${{ needs.release.outputs.new_release_version }}-frontend
            blur88/erp2:latest-frontend
            blur88/master:v${{ needs.release.outputs.new_release_version }}-frontend

      - name: Build and push nginx image
        uses: docker/build-push-action@v7.1.0
        with:
          context: ./nginx
          push: true
          provenance: mode=max,version=v0.2
          sbom: true
          tags: |
            blur88/erp2:v${{ needs.release.outputs.new_release_version }}-nginx
            blur88/erp2:latest-nginx
            blur88/master:v${{ needs.release.outputs.new_release_version }}-nginx
