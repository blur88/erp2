services:
  # PostgreSQL Database
  postgres:
    image: postgres:18.1-alpine3.23
    container_name: erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_db
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      TZ: Asia/Kuala_Lumpur
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - erp_network

  # Redis for caching and sessions
  redis:
    image: redis:8.4.0-alpine3.22
    container_name: erp_redis
    restart: unless-stopped
    environment:
      TZ: Asia/Kuala_Lumpur
    command: redis-server --requirepass redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - erp_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=erp_db
      - DB_USERNAME=erp_user
      - DB_PASSWORD=erp_password
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=erp_db
      - DATABASE_USER=erp_user
      - DATABASE_PASSWORD=erp_password
      - DB_SYNCHRONIZE=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_password
      - JWT_SECRET=b9adcae340bc05b8b527f61067aaad6122cae3639e33e2ec39da3b68ae9d5ff64a080d73f62e384a8f40c49005d7bdf5647d36f019bc625d151f334ca680a4cf
      - JWT_ACCESS_TOKEN_EXPIRY=15m
      - JWT_REFRESH_TOKEN_EXPIRY=7d
      - PORT=3001
      - TZ=Asia/Kuala_Lumpur
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    networks:
      - erp_network
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./backups:/app/backups

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp_frontend
    restart: unless-stopped
    environment:
      # Use relative URLs for VPN compatibility - NGINX will proxy
      - VITE_API_BASE_URL=/api
      - VITE_SOCKET_URL=/
      - TZ=Asia/Kuala_Lumpur
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - erp_network

  # NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: erp_nginx
    restart: unless-stopped
    environment:
      TZ: Asia/Kuala_Lumpur
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - erp_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  erp_network:
    driver: bridge