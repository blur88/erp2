services:
  # PostgreSQL Database
  postgres:
    image: postgres:18.3-alpine3.23
    container_name: erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-erp_db}
      POSTGRES_USER: ${DATABASE_USERNAME:-erp_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data/pgdata
    networks:
      - erp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-erp_user} -d ${DATABASE_NAME:-erp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis — BullMQ queue backing store ONLY (no cache, no sessions).
  #
  # maxmemory-policy MUST stay `noeviction` (issue #1036). BullMQ has no recovery
  # path for evicted keys: under an eviction policy Redis may silently drop job
  # hashes, queue state, or scheduler metadata, and jobs vanish without an error.
  # `noeviction` converts memory pressure into loud failed writes ("OOM command
  # not allowed"), which is the correct trade for a queue.
  #
  # SHARED-INSTANCE CONSTRAINT: cache/session keys must NOT be added to this
  # instance. Cache workloads want eviction; queue workloads must never be
  # evicted, and the two requirements are irreconcilable on one instance.
  # Introducing a cache or session store requires a SEPARATE Redis service —
  # never a policy change back to allkeys-lru. See users.module.ts (dormant
  # CacheModule.register()) for the concrete way this constraint gets violated.
  redis:
    image: redis:8.6.1-alpine3.23
    container_name: erp_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
    volumes:
      - ./data/redis:/data
    networks:
      - erp_network
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend API
  backend:
    image: blur88/all:erp-backend
    container_name: erp_backend
    restart: unless-stopped
    environment:
      # Application
      - NODE_ENV=production
      - PORT=${PORT:-3001}

      # Database
      - DB_HOST=${DATABASE_HOST:-postgres}
      - DB_PORT=${DATABASE_PORT:-5432}
      - DB_DATABASE=${DATABASE_NAME:-erp_db}
      - DB_USERNAME=${DATABASE_USERNAME:-erp_user}
      - DB_PASSWORD=${DATABASE_PASSWORD}
      - DB_LOGGING=false
      - DB_SYNCHRONIZE=false
      - DB_SSL=${DATABASE_SSL:-false}

      # Redis
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_TTL=${REDIS_TTL:-3600}

      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-erp-app}
      - JWT_ISSUER=${JWT_ISSUER:-erp-backend}

      # Security
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CSP_REPORT_ONLY=${CSP_REPORT_ONLY:-false}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      - HSTS_MAX_AGE=${HSTS_MAX_AGE:-31536000}
      - HSTS_INCLUDE_SUBDOMAINS=${HSTS_INCLUDE_SUBDOMAINS:-true}
      - HSTS_PRELOAD=${HSTS_PRELOAD:-true}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-combined}
      - ENABLE_REQUEST_LOGGING=${ENABLE_REQUEST_LOGGING:-true}
      - ENABLE_METRICS=${ENABLE_METRICS:-false}
      - ENABLE_SWAGGER=${ENABLE_SWAGGER:-false}
      - DEBUG_MODE=false

    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erp_network
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-3001}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: false
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Frontend Application
  frontend:
    image: blur88/all:erp-frontend
    container_name: erp_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - erp_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=10M
      - /var/run:size=1M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # NGINX Reverse Proxy
  nginx:
    image: blur88/all:erp-nginx
    container_name: erp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - erp_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=10M
      - /var/run:size=1M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


networks:
  erp_network:
    driver: bridge
