# Mozilla "Intermediate" TLS profile, guidelines 6.0
# (https://data.tlsref.org/guidelines/6.0.json), for the production
# HTTPS listener only (#1975, ADR 0004). Written by hand and checked against
# the pinned copy in scripts/__tests__/fixtures (#2016); never generate this
# file from that copy. The image's nginx is built with
# OpenSSL 3.5, which supports every group below. Include at http scope,
# before the servers that terminate TLS.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
ssl_prefer_server_ciphers off;

# Tickets would need a key shared across workers and rotated, or they weaken
# forward secrecy. Resume sessions by ID from a cache shared by all workers.
ssl_session_tickets off;
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;

# No OCSP stapling, although the guidelines suggest it: Let's Encrypt stopped
# running OCSP responders in 2025, so there is nothing to staple (ADR 0004).
# Do not add ssl_stapling here.
