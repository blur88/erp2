events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Security Headers (Global)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    #
    # Each limiter's own verdict for the request, so that a 429 can be
    # attributed to the limiter that produced it instead of guessed from the
    # status. $msec and $request_time give the ingress clock in milliseconds;
    # $upstream_response_time is "-" when no upstream was contacted and can
    # hold several values when the request was tried more than once.
    log_format limits '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'msec=$msec rt=$request_time urt="$upstream_response_time" '
                      'lreq=$limit_req_status lconn=$limit_conn_status qa="$http_x_qa_request_id"';

    # flush=1s: with the buffer alone a line reaches `docker logs` only once
    # 16k has accumulated, which is not a rate anything can be read at.
    access_log /var/log/nginx/access.log limits buffer=16k flush=1s;
    error_log /var/log/nginx/error.log warn;

    # Rate limiting
    #
    # Reject with 429 Too Many Requests, not the default 503. A 503 is
    # indistinguishable from a real outage in monitoring and gives clients the
    # wrong semantic signal about why they were rejected.
    limit_req_status 429;
    limit_conn_status 429;

    # Per-address limit on /api. Excess requests are delayed, not refused, up
    # to the burst (#1353): several tabs of one browser profile restoring at
    # once each hold one of the browser's connections while they wait, and the
    # browser slows itself down instead of being told "Could not load".
    #
    # burst and delay are thresholds on nginx's count of excess requests, not
    # queue lengths: excess up to delay is forwarded at once, excess between
    # delay and burst is delayed so that requests conform to the rate, and
    # excess above burst is rejected. Excess decays at the zone's rate.
    #
    # The maximum configured limiter delay is therefore (burst - delay) / rate,
    # 1s at these numbers. That is not a wall-clock bound on how long a request
    # takes to reach the backend: scheduling and later request processing add
    # to it.
    #
    # rate 20r/s, burst 40 and delay 20 are provisional (#1353) until workload
    # W1 meets its completion deadlines at 5, 10 and 20 tabs. Sizing also
    # depends on burst size, request timing and backend capacity.
    #
    # This relies on HTTP/1.1's per-profile connection limit. Enabling HTTP/2
    # requires re-running W1 and reassessing both this assumption and
    # `limit_conn addr 10` below, because each concurrent HTTP/2 request counts
    # as a separate connection there. The trigger is HTTP/2, not HTTPS.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # Session upkeep (refresh, logout, /auth/me). Their only credential is a
    # server-signed token, which cannot be guessed, so this guards load rather
    # than passwords. 1 r/s is far above steady use; burst 20 admits 21 at once.
    # The rate and burst are provisional (issue #1345, Task 9 W1) and nothing in
    # the spec fixes them.
    limit_req_zone $binary_remote_addr zone=session_limit:10m rate=1r/s;

    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # User creation is limited per-IP at 10/min, matching the intent that was
    # previously declared by an inert @Throttle() decorator in the backend
    # (removed; see issue #1154).
    #
    # The key is empty for every request except POST /api/users, and nginx
    # ignores a request whose key evaluates empty. That keeps GET /api/users
    # (list) and /api/users/<id> (read, update, delete) on the general
    # api_limit zone rather than sharing this much stricter budget.
    map "$request_method:$uri" $user_create_limit_key {
        default                "";
        "~^POST:/api/users/?$" $binary_remote_addr;
    }

    limit_req_zone $user_create_limit_key zone=user_create_limit:10m rate=10r/m;

    upstream backend {
        server backend:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend {
        server frontend:80 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Main Server
    server {
        listen 80;
        server_name localhost;

        # Security Headers (Server-specific)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Connection limits
        limit_conn addr 10;

        # Hide NGINX version
        server_tokens off;

        # API routes
        location /api {
            limit_req zone=api_limit burst=40 delay=20;

            # Applies only to POST /api/users (see the user_create_limit map);
            # every other request keys empty here and is unaffected.
            #
            # burst=9 nodelay approximates "10 requests per 60 seconds": the
            # 10r/m rate alone would admit one request and reject the next
            # immediately, since nginx meters at a steady 1-per-6s. The burst
            # lets 10 arrive back-to-back, with the 11th rejected.
            limit_req zone=user_create_limit burst=9 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            # CORS (restrictive - only allow your frontend)
            add_header Access-Control-Allow-Origin "http://localhost:3000" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, X-ERP-Session-Protocol" always;
            add_header Access-Control-Allow-Credentials "true" always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Session upkeep. MUST stay above the credential block below: regex
        # locations are tried in file order and the first match wins, so moving
        # this under it silently puts these three routes back on login_limit.
        location ~ ^/api/auth/(refresh|logout|me)/?$ {
            limit_req zone=session_limit burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS
            add_header Access-Control-Allow-Origin "http://localhost:3000" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, X-ERP-Session-Protocol" always;
            add_header Access-Control-Allow-Credentials "true" always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Auth endpoints - stricter rate limiting
        location ~ ^/api/(auth|login|register) {
            limit_req zone=login_limit burst=3 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS
            add_header Access-Control-Allow-Origin "http://localhost:3000" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, X-ERP-Session-Protocol" always;
            add_header Access-Control-Allow-Credentials "true" always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # File uploads
        location /api/uploads {
            client_max_body_size 10M;
            client_body_buffer_size 128k;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Upload timeouts
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # CORS
            add_header Access-Control-Allow-Origin "http://localhost:3000" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, X-ERP-Session-Protocol" always;
            add_header Access-Control-Allow-Credentials "true" always;
        }

        # Static uploads
        location /uploads {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            # Cache static files
            proxy_cache_valid 200 1h;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Frontend - SPA routing
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                proxy_pass http://frontend;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }

    # Health check endpoint
    server {
        listen 8080;
        listen [::]:8080;

        location /health {
            access_log off;
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }
    }
}
