events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Shared security headers are owned by the Ingress
    # (docs/adr/0003-ingress-only-entry-point.md). Upstream copies (backend
    # Helmet, Frontend server) are hidden so each response carries exactly one
    # value, set by the add_header policy in the main server block. Like
    # add_header, proxy_hide_header is inherited only by levels that declare
    # none of their own, so declare it here and nowhere else.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Referrer-Policy;

    # Logging
    access_log /var/log/nginx/access.log combined buffer=16k;
    error_log /var/log/nginx/error.log warn;

    # Rate limiting
    #
    # Reject with 429 Too Many Requests, not the default 503. A 503 is
    # indistinguishable from a real outage in monitoring and gives clients the
    # wrong semantic signal about why they were rejected.
    limit_req_status 429;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # User creation is limited per-IP at 10/min, matching the intent that was
    # previously declared by an inert @Throttle() decorator in the backend
    # (removed; see issue #1154).
    #
    # The key is empty for every request except POST /api/users, and nginx
    # ignores a request whose key evaluates empty. That keeps GET /api/users
    # (list) and /api/users/<id> (read, update, delete) on the general
    # api_limit zone rather than sharing this much stricter budget.
    #
    # Both rate-limit maps match case-insensitively (~*) because Nest's
    # Express router does: /api/AUTH/Login reaches the same handler as
    # /api/auth/login, so it must spend the same budget.
    map "$request_method:$uri" $user_create_limit_key {
        default                 "";
        "~*^POST:/api/users/?$" $binary_remote_addr;
    }

    limit_req_zone $user_create_limit_key zone=user_create_limit:10m rate=10r/m;

    # Sign-in budget: only POST /api/auth/login and POST /api/auth/register.
    # Session traffic (auth/me, auth/refresh, auth/logout,
    # auth/show-default-credentials) keys empty here and stays on api_limit,
    # so loading the app or refreshing a token never spends sign-in attempts.
    map "$request_method:$uri" $login_limit_key {
        default                                 "";
        "~*^POST:/api/auth/(login|register)/?$" $binary_remote_addr;
    }

    limit_req_zone $login_limit_key zone=login_limit:10m rate=5r/m;

    upstream backend {
        server backend:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend {
        server frontend:80 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Main Server
    server {
        listen 80;
        server_name localhost;

        # Security header policy: the only add_header directives in this
        # server. nginx drops inherited add_header directives in any location
        # that declares its own, so locations must not use add_header; set
        # response metadata another way (e.g. default_type) or repeat this
        # whole block there.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Connection limits
        limit_conn addr 10;

        # Hide NGINX version
        server_tokens off;

        # API routes
        location /api {
            limit_req zone=api_limit burst=20 nodelay;

            # Applies only to POST /api/users (see the user_create_limit map);
            # every other request keys empty here and is unaffected.
            #
            # burst=9 nodelay approximates "10 requests per 60 seconds": the
            # 10r/m rate alone would admit one request and reject the next
            # immediately, since nginx meters at a steady 1-per-6s. The burst
            # lets 10 arrive back-to-back, with the 11th rejected.
            limit_req zone=user_create_limit burst=9 nodelay;

            # Applies only to POST /api/auth/login and /api/auth/register (see
            # the login_limit map); every other request keys empty here.
            limit_req zone=login_limit burst=3 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            # CORS, including preflight, is the backend's (ALLOWED_ORIGINS);
            # its headers pass through unchanged.
        }

        # File uploads
        location /api/uploads {
            client_max_body_size 10M;
            client_body_buffer_size 128k;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Upload timeouts
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Static uploads
        location /uploads {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Cache headers come from the backend and pass through.
        }

        # WebSocket support for Socket.IO
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # WebSocket headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket timeouts
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Buffer settings
            proxy_buffering off;
        }

        # Frontend - SPA routing
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Cache headers come from the Frontend server and pass through.
        }
    }

    # Health check endpoint
    server {
        listen 8080;
        listen [::]:8080;

        location /health {
            access_log off;
            default_type text/plain;
            return 200 'healthy\n';
        }
    }
}
