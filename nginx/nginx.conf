events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/http-common.conf;

    # Main Server
    server {
        listen 80;
        server_name localhost;

        include /etc/nginx/app-server.conf;
    }

    include /etc/nginx/health-server.conf;
}
