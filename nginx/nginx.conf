events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Logging
    access_log /var/log/nginx/access.log combined buffer=16k;
    error_log /var/log/nginx/error.log warn;

    # Rate limiting
    #
    # Reject with 429 Too Many Requests, not the default 503. A 503 is
    # indistinguishable from a real outage in monitoring and gives clients the
    # wrong semantic signal about why they were rejected.
    limit_req_status 429;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # User creation is limited per-IP at 10/min, matching the intent that was
    # previously declared by an inert @Throttle() decorator in the backend
    # (removed; see issue #1154).
    #
    # The key is empty for every request except POST /api/users, and nginx
    # ignores a request whose key evaluates empty. That keeps GET /api/users
    # (list) and /api/users/<id> (read, update, delete) on the general
    # api_limit zone rather than sharing this much stricter budget.
    map "$request_method:$uri" $user_create_limit_key {
        default                "";
        "~^POST:/api/users/?$" $binary_remote_addr;
    }

    limit_req_zone $user_create_limit_key zone=user_create_limit:10m rate=10r/m;

    # login_limit (5r/m) is a sign-in budget: it must only be spent by requests
    # that attempt a sign-in. Session traffic (me, refresh, logout,
    # show-default-credentials) stays on the general api_limit zone (#1959).
    #
    # Case-insensitive match and optional trailing slash: Express routes
    # /api/auth/LOGIN and /api/auth/login/ to the same handler, so a
    # case-sensitive key would let a client step around the limit.
    map "$request_method:$uri" $login_limit_key {
        default                                  "";
        "~*^POST:/api/auth/(login|register)/?$" $binary_remote_addr;
    }

    limit_req_zone $login_limit_key zone=login_limit:10m rate=5r/m;

    upstream backend {
        server backend:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend {
        server frontend:80 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Main Server
    server {
        listen 80;
        server_name localhost;

        # Security headers: one policy, defined once (see the file for why it
        # must also be included in any location that declares an add_header).
        # None of the locations below declare their own.
        include /etc/nginx/security-headers.conf;

        # Connection limits. Every browser request now passes through here
        # (ADR 0003), and each open Socket.IO connection holds a slot for its
        # whole life, so 10 was too few for one user with two tabs, never mind
        # an office behind one NAT. Overflow is 429, like the request limits.
        limit_conn_status 429;
        limit_conn addr 50;

        # Hide NGINX version
        server_tokens off;

        # API routes
        location /api {
            limit_req zone=api_limit burst=20 nodelay;

            # Applies only to POST /api/users (see the user_create_limit map);
            # every other request keys empty here and is unaffected.
            #
            # burst=9 nodelay approximates "10 requests per 60 seconds": the
            # 10r/m rate alone would admit one request and reject the next
            # immediately, since nginx meters at a steady 1-per-6s. The burst
            # lets 10 arrive back-to-back, with the 11th rejected.
            limit_req zone=user_create_limit burst=9 nodelay;

            # Applies only to POST /api/auth/login and /api/auth/register (see
            # the login_limit_key map). burst=3 nodelay: 4 attempts back-to-back,
            # then 429 until the 5r/m budget refills.
            limit_req zone=login_limit burst=3 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # File uploads
        location /api/uploads {
            # A longer prefix than /api wins location matching, so the API
            # limits must be repeated here or uploads would skip them.
            limit_req zone=api_limit burst=20 nodelay;
            limit_req zone=user_create_limit burst=9 nodelay;
            limit_req zone=login_limit burst=3 nodelay;

            client_max_body_size 10M;
            client_body_buffer_size 128k;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Upload timeouts
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Static uploads
        location /uploads {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            # No proxy_cache: Cache-Control comes from the backend, unchanged.
        }

        # WebSocket support for Socket.IO
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # WebSocket headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket timeouts
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Buffer settings
            proxy_buffering off;
        }

        # Frontend server: static files and the SPA fallback.
        #
        # Cache-Control is owned by the Frontend server (hashed assets are
        # immutable; index.html, SPA routes and /env-config.js are no-cache).
        # The Ingress sets none here, so it passes through untouched.
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }

    # Container health check only. Never published (ADR 0003), so it is not a
    # client-facing surface and carries no security headers.
    server {
        listen 8080;
        listen [::]:8080;
        server_tokens off;

        location /health {
            access_log off;
            default_type text/plain;
            return 200 'healthy\n';
        }
    }
}
