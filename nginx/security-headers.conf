# The Ingress security-header policy (#1959, ADR 0003). Include this at server
# scope, and in EVERY location that declares its own add_header.
#
# nginx's add_header inheritance: a location that declares any add_header of
# its own silently drops all add_header directives inherited from the server.
# proxy_hide_header follows the same rule. Including this file in such a
# location is what keeps the policy on its responses.
#
# Upstreams (the Frontend server, backend Helmet) also send some of these
# headers with different values. They are hidden here so the client sees
# exactly one copy of each, with the value below.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-XSS-Protection;
proxy_hide_header Referrer-Policy;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Strict-Transport-Security;

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
